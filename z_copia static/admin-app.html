<!DOCTYPE html>
<!--
=================================================================================
 PAGINA: admin-app.html
 (Une las paginas 9, 10 y 11 del mockup: Gestion de Solicitudes / Notificaciones
  / Crear Notificacion, con pestañas igual que en la app del cliente)
=================================================================================
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Music App - Panel Administrador</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="contenedor">

        <div class="barra-pestanas">
            <button class="pestana activa" data-tab="tabGestion">Canciones Solicitadas</button>
            <button class="pestana" data-tab="tabNotificaciones">Notificaciones / Avisos</button>
        </div>

        <div id="mensajeGeneral" class="mensaje error" style="display:none;"></div>

        <!-- ============== PESTAÑA 1: GESTION DE SOLICITUDES (Pagina 9) ============== -->
        <section id="tabGestion">
            <div id="listaGestion" class="lista">
                <p>Cargando solicitudes...</p>
            </div>
        </section>

        <!-- ============== PESTAÑA 2: NOTIFICACIONES (Paginas 10 y 11) ============== -->
        <section id="tabNotificaciones" style="display:none;">

            <!-- Vista A: lista de notificaciones ya enviadas -->
            <div id="vistaListaNotificaciones">
                <div id="listaNotificacionesAdmin" class="lista" style="margin-bottom:16px;">
                    <p>Cargando notificaciones...</p>
                </div>
                <button id="botonMostrarFormulario" class="boton boton-primario boton-bloque">
                    Crear Notificación
                </button>
            </div>

            <!-- Vista B: formulario para crear una notificacion nueva (Pagina 11) -->
            <div id="vistaFormularioNotificacion" style="display:none;">
                <label for="inputTextoNotificacion">Ingrese Texto:</label>
                <textarea id="inputTextoNotificacion" rows="4"
                          placeholder="Escriba el contenido de información..."></textarea>

                <label style="margin-top:14px;">Cargar Imagen:</label>
                <input type="file" id="inputImagenNotificacion" accept="image/*">

                <div style="display:flex; gap:10px; margin-top:16px;">
                    <button id="botonCancelarNotificacion" class="boton boton-secundario" style="flex:1;">Cancelar</button>
                    <button id="botonEnviarNotificacion" class="boton boton-primario" style="flex:1;">Enviar</button>
                </div>
            </div>
        </section>

        <button id="botonCerrarSesion" class="boton boton-secundario boton-bloque" style="margin-top:24px;">
            Cerrar sesión
        </button>
    </div>

    <script src="js/config.js"></script>
    <script src="js/admin-app.js"></script>
</body>
</html>
