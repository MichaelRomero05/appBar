<!DOCTYPE html>
<!--
=================================================================================
 PAGINA: cliente-qr.html  (Mockup pagina 3: "Escanee codigo QR de la mesa")
=================================================================================
 QUE HACE ESTA PAGINA:
 Prende la CAMARA del celular/PC y espera a que el cliente apunte hacia el
 codigo QR pegado en su mesa. Al detectarlo, inicia sesion automaticamente.

 LIBRERIA USADA: "html5-qrcode" (gratuita, se descarga desde un CDN, no hay
 que instalar nada). Es la responsable de "leer" la camara y detectar el QR.

 IMPORTANTE - PERMISOS DE CAMARA:
 El navegador SIEMPRE pedira permiso al usuario para usar la camara. Ademas,
 por seguridad, los navegadores solo permiten usar la camara en paginas
 servidas por HTTPS (o en "localhost" mientras pruebas en tu computador).
 Si publicas la app en internet, asegurate de tener certificado HTTPS.
=================================================================================
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Music App - Escanear QR</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos exclusivos de esta pagina (el recuadro de la camara) */
        .caja-camara {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            border-radius: var(--radio-borde);
            overflow: hidden;
            border: 3px solid var(--acento-teal);
        }
    </style>
</head>
<body>
    <div class="pantalla-login">
        <div class="tarjeta-login">
            <h1>Escanee código<br>QR de la mesa</h1>

            <div id="mensajeEstado" class="mensaje info">Solicitando acceso a la cámara...</div>

            <!-- Aqui la libreria html5-qrcode va a "pintar" el video de la camara -->
            <div id="lectorQr" class="caja-camara"></div>

            <button id="botonVolver" class="boton boton-secundario boton-bloque">Volver al login</button>
        </div>
    </div>

    <!-- Libreria externa que lee codigos QR usando la camara del dispositivo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/cliente-qr.js"></script>
</body>
</html>
