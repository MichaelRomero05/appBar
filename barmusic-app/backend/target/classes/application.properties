# =============================================================================
#  application.properties
# =============================================================================
#  ARCHIVO DE CONFIGURACION PRINCIPAL DE LA APP.
#  Aqui se configuran: conexion a la base de datos, credenciales de Spotify,
#  puerto del servidor, y carpeta de imagenes subidas.
#
#  IMPORTANTE PARA NOVATOS:
#  - Cambia SOLO los valores despues del signo "=" (nunca borres el nombre
#    de la propiedad que esta antes del "=").
#  - Si tu contraseña de MySQL tiene simbolos raros, ponla igual, no
#    necesitas comillas.
# =============================================================================

# -----------------------------------------------------------------------
# 1) CONEXION A LA BASE DE DATOS MYSQL
# -----------------------------------------------------------------------
# Cambia "localhost:3306" solo si tu MySQL corre en otro computador/puerto.
# "barmusic_db" es el nombre que le dimos a la base de datos en el script SQL.
spring.datasource.url=jdbc:mysql://localhost:3306/breaktimespub?useSSL=false&serverTimezone=America/Bogota
spring.datasource.username=root
spring.datasource.password=mike
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------
# 2) CONFIGURACION DE HIBERNATE (el "traductor" entre Java y SQL)
# -----------------------------------------------------------------------
# "validate" = Hibernate revisa que las entidades Java coincidan con las
# tablas que YA existen (creadas con script_creacion_bd.sql) y avisa error
# si no coinciden. NO borra ni modifica tu base de datos.
# Si prefieres que Hibernate cree las tablas automaticamente por ti (util
# para practicar), cambia esto a: update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------
# 3) PUERTO DEL SERVIDOR
# -----------------------------------------------------------------------
# Por defecto la app se abre en http://localhost:8080
server.port=8080

# -----------------------------------------------------------------------
# 4) CREDENCIALES DE SPOTIFY (ver instrucciones en SpotifyConfig.java)
# -----------------------------------------------------------------------
# IMPORTANTE (cambio de Spotify de febrero 2026): ya no basta con
# Client ID + Secret. Necesitas ademas registrar este mismo redirect URI
# en el Dashboard de tu app de Spotify (Settings -> Redirect URIs),
# EXACTO, sin espacios ni barra final distinta.
spotify.client.id=01d5f55bb45a48d3b9d2457a6d84af21
spotify.client.secret=d9db213407c94ad6b216677e50795304
spotify.playlist.id=70MoUMfIjs39BT8dD2kjse?si=yrpJwT3yT1CA0Y4uvWLDoA&utm_source=copy-link&pi=xBYnSCXMTyOh1&sci=spotify%3Acard-config%3A0Nj5D3NwAtaUZURL2CMrvB
spotify.redirect.uri=http://127.0.0.1:8080/api/spotify/callback


# -----------------------------------------------------------------------
# 5) CARPETA DONDE SE GUARDAN LAS IMAGENES DE NOTIFICACIONES
# -----------------------------------------------------------------------
app.uploads.dir=./uploads/notificaciones

# Tamaño maximo permitido para las imagenes que sube el administrador
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
