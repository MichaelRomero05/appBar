<!DOCTYPE html>
<!--
=================================================================================
 PAGINA: cliente-login.html  (Mockup: paginas 1 y 2 - "Vista Usuario Cliente")
=================================================================================
 QUE HACE ESTA PAGINA:
 Permite que un cliente inicie sesion con usuario/contraseña, O que toque el
 boton del QR para ir a escanear el codigo de su mesa (cliente-qr.html).

 COMO CAMBIAR EL TEXTO/TITULO:
 Busca las etiquetas <h1>, <label>, <button> mas abajo y cambia el texto
 que esta ENTRE las etiquetas (nunca borres las etiquetas en si).

 COMO CAMBIAR LA IMAGEN DEL LOGO:
 Reemplaza el archivo img/logo-bar.png por el logo de tu bar (mismo nombre
 de archivo), o cambia el atributo src="img/logo-bar.png" de la etiqueta
 <img id="logoBar"> por la ruta de tu nueva imagen.
=================================================================================
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta etiqueta "viewport" es la que hace que la pagina se vea bien en
         celulares (sin ella, el celular mostraria la pagina "zoomeada" como
         si fuera una version de escritorio). NUNCA la borres. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Music App - Inicio de Sesion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="pantalla-login">
        <div class="tarjeta-login">
            <!-- LOGO: cambia la imagen img/logo-bar.png para poner el logo de tu bar -->
            <img id="logoBar" class="logo-bar" src="img/logo-bar.png"
                 alt="Logo del bar" onerror="this.style.display='none'">

            <h1>Inicio de Sesión</h1>

            <!-- Aqui se muestran mensajes de error si el login falla -->
            <div id="mensajeError" class="mensaje error" style="display:none;"></div>

            <div>
                <label for="inputUsuario">Usuario</label>
                <input type="text" id="inputUsuario" placeholder="correo@correo.com" autocomplete="username">
            </div>

            <div>
                <label for="inputContrasena">Contraseña</label>
                <input type="password" id="inputContrasena" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button id="botonIngresar" class="boton boton-primario boton-bloque">Ingresar</button>

            <div class="separador-o">ó</div>

            <!-- Este boton lleva a la pagina del escaner QR -->
            <button id="botonQr" class="boton-qr" title="Escanear QR de la mesa">
                <!-- Icono QR simple hecho en SVG (no necesita internet ni imagenes externas) -->
                <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm10 0h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 0h2v2h-2zm-2-2h2v2h-2z"/></svg>
            </button>
        </div>
    </div>

    <!-- config.js debe ir SIEMPRE antes que el script de la pagina -->
    <script src="js/config.js"></script>
    <script src="js/cliente-login.js"></script>
</body>
</html>
